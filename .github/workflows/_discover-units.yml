name: Discover Units

# Reusable disk-discovery of every buildable unit under `pillars/` + `libs/`
# (maxdepth 1). A unit is any such dir carrying a recognised manifest:
#   - `package.json`                     -> lang=ts,   pkg = package.json#name
#   - `Cargo.toml` with a `[package]`    -> lang=rust, pkg = crate [package].name
# Manifest-less dirs (moltbot, workspace stubs, stale build-only dirs) are
# skipped. `kind` = pillar|lib by root. `name` is the dir basename and is a
# display/path key ONLY — never a `pnpm --filter` / `cargo -p` selector
# (libs/sdk publishes @pops/pillar-sdk; the dir-name != pkg-name skew is
# LOCKED — selecting on the basename silently matches zero packages).
#
# SCOPE — `maxdepth 1` is deliberate, NOT an oversight. The nested
# `pillars/*/app` frontend members (real pnpm workspace members per
# `pnpm-workspace.yaml` `pillars/*/*`, npm name `@pops/app-<id>`) live at
# maxdepth 2 and collide on basename `app`, so they are intentionally OUT of
# this discovery and OUT of `unit-quality.yml`'s matrix. They are covered by
# two complementary lanes, with NO double-coverage of any one check:
#   - `app-quality.yml` runs EACH app's OWN `typecheck` + `test` suite via its
#     own disk-discovered matrix (the ~180 standalone vitest files that nothing
#     else runs). This is the unit-test lane the apps were missing.
#   - the same matrix builds each app's remote bundle (`build`), the artifact
#     the shell `import()`s at runtime. Until POPS-3227 that compile came from
#     `fe-quality.yml` instead, because every `@pops/app-*` was a static dep of
#     `@pops/shell`; the shell has no such dep now, so the app's own lane is
#     where its source is compiled. `pillar-ui-reachability` (RD-10) asserts
#     every app is reachable from the shell at all, which is what makes "the
#     UI mounts" provable rather than assumed.
# The `assert-app-coverage` job below turns this from a comment into a gate:
# it enumerates the `pillars/*/app` members on disk and FAILS if any one is
# not routed to its covering workflow — so a newly added pillar app whose
# coverage was forgotten breaks discovery loudly instead of shipping untested.
#
# Outputs:
#   units   — every discovered unit (full list)
#   changed — units touched by this PR's diff, OR all units when a shared
#             root (lockfile / base tsconfig / formatter / mise root / Cargo
#             root) changed. Drives the unit-quality matrix.
#
#             The diff's BASE differs by event, because `origin/<branch>` is
#             not a stable "other side" across all of them: on `pull_request`
#             it is `merge-base(origin/<base_ref>, HEAD)`, the PR's fork
#             point. On `push`, `origin/<branch>` is refreshed by the SAME
#             checkout that fetches this run's own commit, so by the time
#             this step runs it already includes (usually equals) HEAD —
#             `merge-base(HEAD, HEAD)` is `HEAD`, and diffing HEAD against
#             itself is empty regardless of what the push actually changed.
#             `push` therefore diffs from `github.event.before` (the ref tip
#             immediately prior to the push) instead — see the `scan` step.
#   changedClientDirs — clients/* dirs touched by this PR's diff, OR every
#             clients/* dir when the same shared root changed. `clients/` has
#             no package.json/Cargo.toml (ADR-043), so `emit` below never
#             discovers it and no `units`/`changed` consumer needs to learn
#             its shape — this is a second, independent output that exists so
#             a formatter-only gate can still scope itself to a PR's clients/
#             changes without pretending clients/ is a unit.

on:
  workflow_call:
    outputs:
      units:
        value: ${{ jobs.list.outputs.units }}
      changed:
        value: ${{ jobs.list.outputs.changed }}
      changedClientDirs:
        value: ${{ jobs.list.outputs.changedClientDirs }}

jobs:
  list:
    name: Discover units from disk
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.scan.outputs.units }}
      changed: ${{ steps.scan.outputs.changed }}
      changedClientDirs: ${{ steps.scan.outputs.changedClientDirs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need merge-base for changed-detection

      - id: scan
        name: Scan pillars/ + libs/ and compute changed set
        run: |
          set -euo pipefail

          # $1 = Cargo.toml path; read [package] name, blank if none.
          crate_name() {
            awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^name[[:space:]]*=/{gsub(/.*=[[:space:]]*"|"[[:space:]]*$/,"");print;exit}' "$1"
          }

          # $1 = root (pillars|libs); emit one JSON object per discovered unit.
          emit() {
            root="$1"
            [ -d "$root" ] || return 0
            find "$root" -mindepth 1 -maxdepth 1 -type d | sort | while read -r d; do
              kind=$([ "$root" = pillars ] && echo pillar || echo lib)
              if   [ -f "$d/package.json" ]; then
                lang=ts; pkg=$(jq -r '.name' "$d/package.json")
              elif [ -f "$d/Cargo.toml" ] && grep -q '^\[package\]' "$d/Cargo.toml"; then
                lang=rust; pkg=$(crate_name "$d/Cargo.toml")
              else
                continue # manifest-less dir (moltbot, workspace stubs) — skip
              fi
              [ -n "$pkg" ] && [ "$pkg" != null ] || { echo "::error::no pkg name for $d" >&2; exit 1; }
              jq -n --arg n "$(basename "$d")" --arg pkg "$pkg" --arg dir "$d" \
                    --arg k "$kind" --arg l "$lang" \
                    '{name:$n,pkg:$pkg,dir:$dir,kind:$k,lang:$l}'
            done
          }

          units=$( { emit pillars; emit libs; } | jq -s -c '.')
          echo "units=$units" >> "$GITHUB_OUTPUT"
          echo "Discovered units:"
          echo "$units" | jq .

          if [ "${{ github.event_name }}" = "push" ]; then
            # See the Outputs comment above — origin/<branch> is not a usable
            # "other side" here, it is (at best) the same commit as HEAD. Use
            # the push event's own before/after boundary instead. `before` is
            # all-zeros on a branch's first push, can name a commit this
            # checkout's history doesn't contain after a force-push, or —
            # also a force-push, but the sneakier case — can resolve to a
            # real commit that is NOT an ancestor of HEAD (e.g. a rewritten
            # history where the old tip is still reachable from some other
            # ref). Diffing against an unrelated tip would produce an
            # arbitrary changed-set instead of "what this push actually
            # changed", which is worse than no diff at all. Every one of
            # these is "no diff worth trusting", so fall through to the
            # shared-root "build everything" path below rather than silently
            # computing "nothing changed" or something plausible-looking but
            # wrong.
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git merge-base --is-ancestor "$before" HEAD 2>/dev/null; then
              base="$before"
            else
              base=""
            fi
          else
            base=$(git merge-base "origin/${{ github.base_ref || 'main' }}" HEAD || echo HEAD~1)
          fi

          if [ -n "$base" ]; then
            diff=$(git diff --name-only "$base" HEAD)
          else
            diff=""
          fi
          echo "Changed files vs ${base:-<no usable base for this push - treating as full sweep>}:"
          echo "$diff"

          # A shared-root touch invalidates everything (lockfile / base
          # tsconfig / formatter / linter / mise root / cargo root) -> build
          # ALL. An unusable push base (above, `base` left empty) gets the
          # same treatment: no diff to trust means no unit can be safely
          # excluded either.
          shared_root_pattern='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|tsconfig\.build\.json|\.oxfmtrc\.json|\.oxlintrc\.json|mise\.toml|mise\.ci\.toml|Cargo\.toml|Cargo\.lock)$'
          if [ -z "$base" ] || echo "$diff" | grep -qE "$shared_root_pattern"; then
            if [ -z "$base" ]; then
              echo "No usable git base for this push's diff — building ALL units."
            else
              echo "Shared root changed — building ALL units."
            fi
            echo "changed=$units" >> "$GITHUB_OUTPUT"
            shared_root_changed=1
          else
            changed=$(DIFF="$diff" jq -c -n --argjson units "$units" \
              '$units | [.[] | select(.dir as $d | ($ENV.DIFF | test("(^|\\n)"+$d+"/")))]')
            echo "Changed units:"
            echo "$changed" | jq .
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
            shared_root_changed=0
          fi

          # clients/* by the same per-dir rule as units above — a PR touching
          # only clients/ios must not also pull in an unrelated client's
          # pre-existing drift — kept separate from `units`/`changed` (see the
          # Outputs comment above for why).
          client_dirs=""
          [ -d clients ] && client_dirs=$(find clients -mindepth 1 -maxdepth 1 -type d | sort)
          changed_client_dirs=""
          if [ -n "$client_dirs" ]; then
            if [ "$shared_root_changed" = 1 ]; then
              changed_client_dirs=$(echo "$client_dirs" | tr '\n' ' ')
            else
              while IFS= read -r d; do
                echo "$diff" | grep -qE "(^|\\n)$d/" && changed_client_dirs="$changed_client_dirs $d"
              done <<<"$client_dirs"
              changed_client_dirs=$(echo "$changed_client_dirs" | xargs)
            fi
          fi
          echo "changedClientDirs=$changed_client_dirs" >> "$GITHUB_OUTPUT"
          echo "Changed client dirs: $changed_client_dirs"

  assert-app-coverage:
    # Proves the maxdepth-1 scope above leaves NO `pillars/*/app` member
    # uncovered. Each such member (npm name `@pops/app-<id>`) is excluded from
    # the unit matrix by design; this job fails loud if any one is not routed
    # to its own unit lane (app-quality.yml), which since POPS-3227 is the only
    # lane that compiles an app on an app-source change — so "every unit is
    # covered" is a gate, not a hope. Pure disk + workflow-file reads — no
    # install.
    name: Assert pillars/*/app are routed to app-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every pillars/*/app is named @pops/app-* and covered by both lanes
        run: |
          set -euo pipefail

          # app-quality runs each app's OWN typecheck, test and remote-bundle
          # build via a disk-discovered matrix; this glob is what fires it on
          # any app change. If it is ever dropped, app changes ship untested
          # AND unbuilt — the shell stopped compiling app source at POPS-3227.
          aq=.github/workflows/app-quality.yml
          [ -f "$aq" ] || { echo "::error::$aq missing — pillars/*/app lose their own typecheck+test lane"; exit 1; }
          grep -qE '^\s*-\s*["'\'']?pillars/\*/app/\*\*' "$aq" \
            || { echo "::error::$aq no longer triggers on 'pillars/*/app/**' — app unit-test coverage lost"; exit 1; }

          # The build step itself, not just the trigger: without it the lane
          # runs on every app change and compiles none of them.
          grep -qE 'pnpm --filter .*matrix\.app\.pkg.*" build$' "$aq" \
            || { echo "::error::$aq no longer builds the app's remote bundle — app build coverage lost"; exit 1; }

          missing=0
          while IFS= read -r appdir; do
            [ -f "$appdir/package.json" ] || continue
            pkg=$(jq -r '.name' "$appdir/package.json")
            case "$pkg" in
              @pops/app-*) : ;;
              *) echo "::error::$appdir is a nested workspace member named '$pkg' (expected @pops/app-*); unit-discovery does not see maxdepth-2 members — give it explicit coverage or fix the name"; missing=1; continue ;;
            esac
            # Both lanes discover apps from disk by the @pops/app-* name, so a
            # correctly named member is automatically picked up by each — the
            # glob assertions above guarantee both fire on app changes.
            echo "$pkg -> app-quality.yml (own typecheck + test + remote-bundle build)"
          done < <(find pillars -mindepth 2 -maxdepth 2 -type d -name app | sort)

          [ "$missing" = 0 ] || { echo "::error::one or more pillars/*/app members are uncovered"; exit 1; }
          echo "All pillars/*/app members are routed to app-quality."
